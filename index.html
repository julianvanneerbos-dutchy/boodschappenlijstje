
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boodschappenlijst</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f3f4f6; margin: 0; padding: 1.25rem; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; background: #fff; border-radius: 18px; padding: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    h1 { font-size: 1.5rem; margin-top: 0; margin-bottom: 1.25rem; color: #111827; }
    
    .input-wrapper { position: relative; width: 100%; }
    .input-row { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
    input[type="text"] { width: 100%; padding: 0.85rem 1rem; border: 1.5px solid #d1d5db; border-radius: 12px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
    input[type="text"]:focus { border-color: #2563eb; }
    button.btn-add { background: #2563eb; color: #fff; border: none; border-radius: 12px; padding: 0.85rem 1.25rem; font-weight: 600; cursor: pointer; font-size: 1rem; white-space: nowrap; }
    button.btn-add:active { background: #1d4ed8; }

    /* Autocomplete dropdown */
    .suggestions-list {
      position: absolute;
      top: 105%;
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      max-height: 220px;
      overflow-y: auto;
      z-index: 50;
      list-style: none;
      padding: 0;
      margin: 0;
      display: none;
    }
    .suggestions-list li {
      padding: 0.8rem 1rem;
      cursor: pointer;
      font-size: 1rem;
      border-bottom: 1px solid #f3f4f6;
      -webkit-tap-highlight-color: rgba(37, 99, 235, 0.1);
    }
    .suggestions-list li:last-child { border-bottom: none; }
    .suggestions-list li:hover, .suggestions-list li:active { background-color: #eff6ff; color: #2563eb; font-weight: 500; }

    /* Boodschappenlijst */
    ul#items-list { list-style: none; padding: 0; margin: 0; }
    li.item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 0.5rem;
      border-bottom: 1px solid #f3f4f6;
      gap: 0.5rem;
    }
    .item-left { display: flex; align-items: center; gap: 0.75rem; flex: 1; cursor: pointer; user-select: none; }
    .item-left input[type="checkbox"] { width: 1.3rem; height: 1.3rem; cursor: pointer; border-radius: 6px; }
    .item-name { font-size: 1.05rem; color: #1f2937; word-break: break-word; }
    .done { text-decoration: line-through; color: #9ca3af; }

    /* Knoppen per item */
    .item-actions { display: flex; align-items: center; gap: 0.25rem; }
    .btn-move {
      background: #f3f4f6;
      border: none;
      color: #6b7280;
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .btn-move:active { background: #e5e7eb; color: #111827; }
    .btn-move:disabled { opacity: 0.25; cursor: not-allowed; }
    .btn-delete {
      background: transparent;
      border: none;
      color: #ef4444;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
      margin-left: 0.25rem;
    }

    /* Lijst legen footer knop */
    .list-footer { margin-top: 1.5rem; text-align: center; }
    .btn-clear-all {
      background: #fee2e2;
      color: #b91c1c;
      border: none;
      padding: 0.65rem 1.25rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn-clear-all:active { background: #fecaca; }
    .btn-clear-all:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Pop-up Modaal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: #fff;
      border-radius: 16px;
      padding: 1.5rem;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
    }
    .modal-box h3 { margin-top: 0; font-size: 1.25rem; color: #111827; }
    .modal-box p { color: #6b7280; font-size: 0.95rem; margin-bottom: 1.5rem; }
    .modal-actions { display: flex; gap: 0.75rem; justify-content: center; }
    .modal-btn {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
    .btn-cancel { background: #f3f4f6; color: #374151; }
    .btn-cancel:active { background: #e5e7eb; }
    .btn-confirm-delete { background: #ef4444; color: #ffffff; }
    .btn-confirm-delete:active { background: #dc2626; }
  </style>
</head>
<body>

<div class="container">
  <h1>Boodschappen 🛒</h1>
  
  <form id="add-form" class="input-row" autocomplete="off">
    <div class="input-wrapper">
      <input type="text" id="item-input" placeholder="Wat moeten we halen? (bv. Bananen)" required>
      <ul id="suggestions" class="suggestions-list"></ul>
    </div>
    <button type="submit" class="btn-add">Toevoegen</button>
  </form>

  <ul id="items-list"></ul>

  <div class="list-footer">
    <button id="btn-open-clear" class="btn-clear-all" disabled>
      🗑️ Hele lijst legen
    </button>
  </div>
</div>

<!-- Modal Pop-up -->
<div id="clear-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3>Zeker weten?</h3>
    <p>Weet je zeker dat je de hele boodschappenlijst wilt wissen?</p>
    <div class="modal-actions">
      <button id="btn-modal-cancel" class="modal-btn btn-cancel">Annuleren</button>
      <button id="btn-modal-confirm" class="modal-btn btn-confirm-delete">Wissen</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, serverTimestamp, writeBatch } 
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDK3TfrCTrpEXgDeG7eD2_B2KEDwPmqWQE",
    authDomain: "onze-boodschappenlijst.firebaseapp.com",
    projectId: "onze-boodschappenlijst",
    storageBucket: "onze-boodschappenlijst.firebasestorage.app",
    messagingSenderId: "188911309446",
    appId: "1:188911309446:web:3283e385fc23f2ee65f707",
    measurementId: "G-DD8RZY54ZE"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const itemsCol = collection(db, "groceries");

  // 1. Laad producten in vanuit products.json
  let commonGroceries = [];
  fetch('products.json?v=' + Date.now())
    .then(res => {
      if (!res.ok) throw new Error("Status " + res.status);
      return res.json();
    })
    .then(data => {
      commonGroceries = data;
    })
    .catch(err => {
      console.error("Kon products.json niet laden, fallback actief:", err);
      commonGroceries = ["Banaan", "Bananen", "Brood", "Melk", "Tomaten", "Appels", "Eieren", "Kaas"];
    });

  // 2. Autocomplete dropdown logica
  const inputEl = document.getElementById("item-input");
  const suggestionsEl = document.getElementById("suggestions");

  function selectSuggestion(item) {
    inputEl.value = item;
    suggestionsEl.style.display = "none";
    inputEl.focus();
  }

  inputEl.addEventListener("input", () => {
    const val = inputEl.value.toLowerCase().trim();
    suggestionsEl.innerHTML = "";

    if (val.length < 1) {
      suggestionsEl.style.display = "none";
      return;
    }

    const matches = commonGroceries
      .filter(item => typeof item === "string" && item.toLowerCase().includes(val))
      .slice(0, 6);

    if (matches.length === 0) {
      suggestionsEl.style.display = "none";
      return;
    }

    matches.forEach(item => {
      const li = document.createElement("li");
      li.textContent = item;

      li.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        selectSuggestion(item);
      });

      suggestionsEl.appendChild(li);
    });

    suggestionsEl.style.display = "block";
  });

  document.addEventListener("pointerdown", (e) => {
    if (!inputEl.contains(e.target) && !suggestionsEl.contains(e.target)) {
      suggestionsEl.style.display = "none";
    }
  });

  // 3. Realtime weergave met volgorde
  let currentItems = [];
  const clearBtn = document.getElementById("btn-open-clear");
  const q = query(itemsCol, orderBy("order", "asc"));

  onSnapshot(q, (snapshot) => {
    currentItems = [];
    snapshot.forEach(docSnap => {
      currentItems.push({ id: docSnap.id, ...docSnap.data() });
    });
    
    // Knop uitschakelen als er geen items zijn
    clearBtn.disabled = currentItems.length === 0;

    renderList();
  });

  function renderList() {
    const listEl = document.getElementById("items-list");
    listEl.innerHTML = "";

    currentItems.forEach((item, index) => {
      const li = document.createElement("li");
      li.className = "item-row";

      li.innerHTML = `
        <div class="item-left">
          <input type="checkbox" ${item.completed ? "checked" : ""}>
          <span class="item-name ${item.completed ? "done" : ""}">${item.name}</span>
        </div>
        <div class="item-actions">
          <button class="btn-move btn-up" ${index === 0 ? "disabled" : ""} title="Omhoog">▲</button>
          <button class="btn-move btn-down" ${index === currentItems.length - 1 ? "disabled" : ""} title="Omlaag">▼</button>
          <button class="btn-delete" title="Verwijderen">&times;</button>
        </div>
      `;

      // Status afvinken
      li.querySelector(".item-left").addEventListener("click", () => {
        updateDoc(doc(db, "groceries", item.id), { completed: !item.completed });
      });

      // Omhoog verplaatsen
      li.querySelector(".btn-up").addEventListener("click", (e) => {
        e.stopPropagation();
        if (index > 0) swapOrder(index, index - 1);
      });

      // Omlaag verplaatsen
      li.querySelector(".btn-down").addEventListener("click", (e) => {
        e.stopPropagation();
        if (index < currentItems.length - 1) swapOrder(index, index + 1);
      });

      // Verwijderen
      li.querySelector(".btn-delete").addEventListener("click", (e) => {
        e.stopPropagation();
        deleteDoc(doc(db, "groceries", item.id));
      });

      listEl.appendChild(li);
    });
  }

  // Volgorde verwisselen
  async function swapOrder(idx1, idx2) {
    const item1 = currentItems[idx1];
    const item2 = currentItems[idx2];
    const batch = writeBatch(db);

    batch.update(doc(db, "groceries", item1.id), { order: item2.order ?? idx2 });
    batch.update(doc(db, "groceries", item2.id), { order: item1.order ?? idx1 });
    await batch.commit();
  }

  // Nieuw item toevoegen
  document.getElementById("add-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = inputEl.value.trim();
    if (!name) return;

    const nextOrder = currentItems.length > 0 
      ? Math.max(...currentItems.map(i => i.order ?? 0)) + 1 
      : 1;

    await addDoc(itemsCol, {
      name: name,
      completed: false,
      order: nextOrder,
      createdAt: serverTimestamp()
    });

    inputEl.value = "";
    suggestionsEl.style.display = "none";
  });

  // 4. Modal en hele lijst wissen
  const modalEl = document.getElementById("clear-modal");
  const cancelBtn = document.getElementById("btn-modal-cancel");
  const confirmBtn = document.getElementById("btn-modal-confirm");

  clearBtn.addEventListener("click", () => {
    modalEl.classList.remove("hidden");
  });

  cancelBtn.addEventListener("click", () => {
    modalEl.classList.add("hidden");
  });

  confirmBtn.addEventListener("click", async () => {
    modalEl.classList.add("hidden");
    if (currentItems.length === 0) return;

    const batch = writeBatch(db);
    currentItems.forEach(item => {
      batch.delete(doc(db, "groceries", item.id));
    });
    await batch.commit();
  });
</script>
</body>
</html>
