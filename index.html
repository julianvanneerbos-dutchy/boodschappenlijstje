<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gedeelde Boodschappen</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f3f4f6; margin: 0; padding: 1.5rem; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; background: #fff; border-radius: 16px; padding: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    h1 { font-size: 1.5rem; margin-top: 0; color: #111827; }
    .input-row { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
    input[type="text"] { flex: 1; padding: 0.75rem 1rem; border: 1px solid #d1d5db; border-radius: 10px; font-size: 1rem; outline: none; }
    input[type="text"]:focus { border-color: #2563eb; }
    button.btn-add { background: #2563eb; color: #fff; border: none; border-radius: 10px; padding: 0.75rem 1.25rem; font-weight: 600; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 0.5rem; border-bottom: 1px solid #f3f4f6; }
    .item-left { display: flex; align-items: center; gap: 0.75rem; flex: 1; cursor: pointer; }
    .done { text-decoration: line-through; color: #9ca3af; }
    .btn-delete { background: transparent; border: none; color: #ef4444; font-size: 1.1rem; cursor: pointer; padding: 0.25rem 0.5rem; }
  </style>
</head>
<body>

<div class="container">
  <h1>Boodschappenlijst 🛒</h1>
  <form id="add-form" class="input-row">
    <input type="text" id="item-input" placeholder="Wat moeten we halen?" autocomplete="off" required>
    <button type="submit" class="btn-add">Toevoegen</button>
  </form>

  <ul id="items-list"></ul>
</div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, serverTimestamp } 
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDK3TfrCTrpEXgDeG7eD2_B2KEDwPmqWQE",
  authDomain: "onze-boodschappenlijst.firebaseapp.com",
  projectId: "onze-boodschappenlijst",
  storageBucket: "onze-boodschappenlijst.firebasestorage.app",
  messagingSenderId: "188911309446",
  appId: "1:188911309446:web:3283e385fc23f2ee65f707",
  measurementId: "G-DD8RZY54ZE"
};
  
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const itemsCol = collection(db, "groceries");

  // Realtime synchronisatie
  const q = query(itemsCol, orderBy("createdAt", "asc"));
  onSnapshot(q, (snapshot) => {
    const listEl = document.getElementById("items-list");
    listEl.innerHTML = "";
    
    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const li = document.createElement("li");

      li.innerHTML = `
        <div class="item-left">
          <input type="checkbox" ${data.completed ? "checked" : ""}>
          <span class="${data.completed ? "done" : ""}">${data.name}</span>
        </div>
        <button class="btn-delete" title="Verwijderen">&times;</button>
      `;

      // Status wisselen (gehaald / niet gehaald)
      li.querySelector(".item-left").addEventListener("click", () => {
        updateDoc(doc(db, "groceries", docSnap.id), { completed: !data.completed });
      });

      // Item verwijderen
      li.querySelector(".btn-delete").addEventListener("click", (e) => {
        e.stopPropagation();
        deleteDoc(doc(db, "groceries", docSnap.id));
      });

      listEl.appendChild(li);
    });
  });

  // Nieuw item toevoegen
  document.getElementById("add-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("item-input");
    const name = input.value.trim();
    if (!name) return;

    await addDoc(itemsCol, {
      name,
      completed: false,
      createdAt: serverTimestamp()
    });
    input.value = "";
  });
</script>
</body>
</html>
