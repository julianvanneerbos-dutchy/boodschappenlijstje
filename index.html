<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Boodschappenlijstjes</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Boodschappen">
  <meta name="theme-color" content="#4f46e5">

  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Externe stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <!-- VIEW 0: PINCODE (Firebase Auth) -->
  <section id="view-auth">
    <div class="auth-icon">🔒</div>
    <h2 class="auth-title">Toegangscode</h2>
    <p class="auth-subtitle">Beveiligd gezinslijstje</p>
    
    <form id="auth-form" autocomplete="off">
      <input type="password" id="auth-pin" class="auth-pin-input" inputmode="numeric" maxlength="6" placeholder="••••••" required autofocus>
      <button type="submit" class="btn-primary auth-submit-btn">Ontgrendelen</button>
      <div id="auth-error" class="auth-error"></div>
    </form>
  </section>

  <!-- VIEW 1: OVERZICHT VAN ALLE LIJSTEN -->
  <section id="view-dashboard" class="hidden">
    <header>
      <h1>Mijn Lijstjes 📋</h1>
      <button id="btn-lock-app" class="btn-icon" title="Uitloggen">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Uitloggen
      </button>
    </header>
    
    <form id="add-list-form" class="input-row" autocomplete="off">
      <input type="text" id="new-list-name" placeholder="Nieuw lijstje (bv. Albert Heijn)..." required>
      <button type="submit" class="btn-primary">Aanmaken</button>
    </form>

    <ul id="lists-container" class="cards-list"></ul>
    <div id="lists-empty" class="empty-state hidden">Nog geen lijstjes aangemaakt. Voeg er hierboven een toe!</div>

    <div class="dashboard-footer">
      <button id="btn-open-changelog" class="changelog-link">Wat is er nieuw?</button>
    </div>
  </section>

  <!-- VIEW 2: INDIVIDUELE LIJST WEERGAVE -->
  <section id="view-list-detail" class="hidden">
    <header>
      <button id="btn-back-to-dashboard" class="btn-icon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Overzicht
      </button>
      <h1 id="active-list-title" class="list-title-text">Lijst</h1>
    </header>

    <form id="add-item-form" class="input-row" autocomplete="off">
      <div class="input-wrapper">
        <input type="text" id="item-input" placeholder="Wat moeten we halen?" required>
        <ul id="suggestions" class="suggestions-list"></ul>
      </div>
      <button type="submit" class="btn-primary">Toevoegen</button>
    </form>

    <ul id="items-list"></ul>
    <div id="items-empty" class="empty-state hidden">Geen producten op deze lijst.</div>

    <!-- STATISTIEKENBALK ONDERAAN -->
    <div id="summary-container" class="summary-card hidden">
      <div class="summary-item">
        <span class="summary-label">Totaal</span>
        <span id="summary-total" class="summary-value">0</span>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-item">
        <span class="summary-label">Te halen</span>
        <span id="summary-to-buy" class="summary-value to-buy">0</span>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-item">
        <span class="summary-label">In mandje</span>
        <span id="summary-in-cart" class="summary-value in-cart">0</span>
      </div>
    </div>

    <!-- OPMERKINGEN KAART -->
    <div id="note-card-container" class="note-card">
      <div class="note-header">
        <span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          Opmerking
        </span>
        <span id="note-saved-indicator" class="note-saved-text">Opgeslagen ✓</span>
      </div>
      <textarea id="list-note-input" class="note-textarea" placeholder="Opmerking toevoegen (bv. statiegeld meenemen)..." rows="2"></textarea>
      <div class="note-actions">
        <button id="btn-save-note" class="btn-save-note">Opslaan</button>
      </div>
    </div>

    <div class="list-footer">
      <button id="btn-open-clear-items" class="btn-clear-all" disabled>
        Lijst leegmaken
      </button>
    </div>
  </section>

  <!-- VIEW 3: WEEKMENU KALENDER -->
  <section id="view-mealplanner" class="hidden">
    <header>
      <h1>Wat eten we? 🍽️</h1>
      <button id="btn-lock-app-meals" class="btn-icon" title="Uitloggen">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Uitloggen
      </button>
    </header>

    <!-- Week-kiezer tabs -->
    <div class="week-switch">
      <button id="tab-prev-week" class="week-btn">Vorige week</button>
      <button id="tab-this-week" class="week-btn active">Deze week</button>
      <button id="tab-next-week" class="week-btn">Volgende week</button>
    </div>

    <div id="meals-container" class="meals-list"></div>
  </section>
</div>

<!-- BOTTOM NAVIGATION (Staat buiten de scrollende container) -->
<nav id="bottom-nav" class="bottom-nav hidden">
  <button id="nav-btn-lists" class="nav-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
    <span>Lijstjes</span>
  </button>
  <button id="nav-btn-meals" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2v20M2 7h5a3 3 0 0 1 3 3v12M2 13h10M6 2v5"></path></svg>
    <span>Weekmenu</span>
  </button>
</nav>

<!-- Modal Pop-up voor Bevestiging / Wissen -->
<div id="confirm-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3
