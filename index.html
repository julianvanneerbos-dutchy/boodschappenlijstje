<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boodschappenlijstjes</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f3f4f6; margin: 0; padding: 1.25rem; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; background: #fff; border-radius: 18px; padding: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    h1 { font-size: 1.45rem; margin: 0; color: #111827; display: flex; align-items: center; gap: 0.5rem; }
    
    .btn-icon {
      background: #f3f4f6;
      border: none;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      font-weight: 600;
      color: #374151;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.9rem;
    }
    .btn-icon:active { background: #e5e7eb; }

    /* Invoervelden & formulieren */
    .input-wrapper { position: relative; width: 100%; }
    .input-row { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
    input[type="text"], input[type="password"] { width: 100%; padding: 0.85rem 1rem; border: 1.5px solid #d1d5db; border-radius: 12px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
    input[type="text"]:focus, input[type="password"]:focus { border-color: #2563eb; }
    button.btn-primary { background: #2563eb; color: #fff; border: none; border-radius: 12px; padding: 0.85rem 1.25rem; font-weight: 600; cursor: pointer; font-size: 1rem; white-space: nowrap; }
    button.btn-primary:active { background: #1d4ed8; }

    /* Pincode Scherm */
    #view-auth { text-align: center; padding: 1.5rem 0; }
    .auth-icon { font-size: 3rem; margin-bottom: 0.75rem; }
    .auth-pin-input {
      letter-spacing: 0.5rem;
      font-size: 1.5rem;
      text-align: center;
      width: 180px;
      margin: 0 auto 1rem auto;
      display: block;
    }
    .auth-error { color: #ef4444; font-size: 0.9rem; margin-top: 0.5rem; min-height: 1.2rem; }

    /* Autocomplete dropdown */
    .suggestions-list {
      position: absolute;
      top: 105%;
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      max-height: 220px;
      overflow-y: auto;
      z-index: 50;
      list-style: none;
      padding: 0;
      margin: 0;
      display: none;
    }
    .suggestions-list li {
      padding: 0.8rem 1rem;
      cursor: pointer;
      font-size: 1rem;
      border-bottom: 1px solid #f3f4f6;
      -webkit-tap-highlight-color: rgba(37, 99, 235, 0.1);
    }
    .suggestions-list li:last-child { border-bottom: none; }
    .suggestions-list li:hover, .suggestions-list li:active { background-color: #eff6ff; color: #2563eb; font-weight: 500; }

    /* Overzicht kaarten */
    ul.cards-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.75rem; }
    li.list-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 1rem 1.15rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    li.list-card:active { background: #eff6ff; border-color: #bfdbfe; }
    .card-info h3 { margin: 0; font-size: 1.1rem; color: #1f2937; }
    .card-info span { font-size: 0.85rem; color: #6b7280; }
    .btn-delete-card {
      background: transparent;
      border: none;
      color: #ef4444;
      font-size: 1.25rem;
      cursor: pointer;
      padding: 0.4rem 0.6rem;
      border-radius: 8px;
    }
    .btn-delete-card:active { background: #fee2e2; }

    /* Items in lijst */
    ul#items-list { list-style: none; padding: 0; margin: 0; }
    li.item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 0.5rem;
      border-bottom: 1px solid #f3f4f6;
      gap: 0.5rem;
    }
    .item-left { display: flex; align-items: center; gap: 0.75rem; flex: 1; cursor: pointer; user-select: none; }
    .item-left input[type="checkbox"] { width: 1.3rem; height: 1.3rem; cursor: pointer; border-radius: 6px; }
    .item-name { font-size: 1.05rem; color: #1f2937; word-break: break-word; }
    .done { text-decoration: line-through; color: #9ca3af; }

    .item-actions { display: flex; align-items: center; gap: 0.25rem; }
    .btn-move {
      background: #f3f4f6;
      border: none;
      color: #6b7280;
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .btn-move:active { background: #e5e7eb; color: #111827; }
    .btn-move:disabled { opacity: 0.25; cursor: not-allowed; }
    .btn-delete-item {
      background: transparent;
      border: none;
      color: #ef4444;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
      margin-left: 0.25rem;
    }

    /* Footer */
    .list-footer { margin-top: 1.5rem; text-align: center; }
    .btn-clear-all {
      background: #fee2e2;
      color: #b91c1c;
      border: none;
      padding: 0.65rem 1.25rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-clear-all:active { background: #fecaca; }
    .btn-clear-all:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Modaal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: #fff;
      border-radius: 16px;
      padding: 1.5rem;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
    }
    .modal-box h3 { margin-top: 0; font-size: 1.25rem; color: #111827; }
    .modal-box p { color: #6b7280; font-size: 0.95rem; margin-bottom: 1.5rem; }
    .modal-actions { display: flex; gap: 0.75rem; justify-content: center; }
    .modal-btn {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
    .btn-cancel { background: #f3f4f6; color: #374151; }
    .btn-confirm-delete { background: #ef4444; color: #ffffff; }

    .empty-state { text-align: center; color: #9ca3af; padding: 2rem 0; font-size: 0.95rem; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <!-- VIEW 0: PINCODE VERGRENDELING -->
  <section id="view-auth">
    <div class="auth-icon">🔒</div>
    <h2 style="margin: 0 0 0.5rem 0; color: #111827;">Voer toegangscode in</h2>
    <p style="color: #6b7280; font-size: 0.95rem; margin-bottom: 1.5rem;">Deze lijst is privé beveiligd.</p>
    
    <form id="auth-form" autocomplete="off">
      <input type="password" id="auth-pin" class="auth-pin-input" inputmode="numeric" maxlength="6" placeholder="••••" required autofocus>
      <button type="submit" class="btn-primary" style="width: 180px;">Ontgrendelen</button>
      <div id="auth-error" class="auth-error"></div>
    </form>
  </section>

  <!-- VIEW 1: OVERZICHT VAN ALLE LIJSTEN -->
  <section id="view-dashboard" class="hidden">
    <header>
      <h1>Mijn Lijstjes 📋</h1>
      <button id="btn-lock-app" class="btn-icon" title="Vergrendel app">🔒</button>
    </header>
    
    <form id="add-list-form" class="input-row" autocomplete="off">
      <input type="text" id="new-list-name" placeholder="Naam nieuw lijstje (bv. Albert Heijn)..." required>
      <button type="submit" class="btn-primary">Aanmaken</button>
    </form>

    <ul id="lists-container" class="cards-list"></ul>
    <div id="lists-empty" class="empty-state hidden">Nog geen lijstjes aangemaakt. Voeg er hierboven een toe!</div>
  </section>

  <!-- VIEW 2: INDIVIDUELE LIJST WEERGAVE -->
  <section id="view-list-detail" class="hidden">
    <header>
      <button id="btn-back-to-dashboard" class="btn-icon">← Overzicht</button>
      <h1 id="active-list-title" style="font-size: 1.25rem; text-align: right;">Lijst</h1>
    </header>

    <form id="add-item-form" class="input-row" autocomplete="off">
      <div class="input-wrapper">
        <input type="text" id="item-input" placeholder="Wat moeten we halen? (bv. Bananen)" required>
        <ul id="suggestions" class="suggestions-list"></ul>
      </div>
      <button type="submit" class="btn-primary">Toevoegen</button>
    </form>

    <ul id="items-list"></ul>
    <div id="items-empty" class="empty-state hidden">Lijst is leeg! Voeg hierboven een product toe.</div>

    <div class="list-footer">
      <button id="btn-open-clear-items" class="btn-clear-all" disabled>
        🗑️ Alle producten wissen
      </button>
    </div>
  </section>
</div>

<!-- Modal Pop-up voor bevestiging -->
<div id="confirm-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3 id="modal-title">Zeker weten?</h3>
    <p id="modal-message">Weet je het zeker?</p>
    <div class="modal-actions">
      <button id="btn-modal-cancel" class="modal-btn btn-cancel">Annuleren</button>
      <button id="btn-modal-confirm" class="modal-btn btn-confirm-delete">Verwijderen</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { 
    getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, 
    query, orderBy, serverTimestamp, writeBatch, getDocs 
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ==========================================
  // STEL HIER JE GEWENSTE PINCODE IN:
  // ==========================================
  const APP_PIN = "2112";

  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyDK3TfrCTrpEXgDeG7eD2_B2KEDwPmqWQE",
    authDomain: "onze-boodschappenlijst.firebaseapp.com",
    projectId: "onze-boodschappenlijst",
    storageBucket: "onze-boodschappenlijst.firebasestorage.app",
    messagingSenderId: "188911309446",
    appId: "1:188911309446:web:3283e385fc23f2ee65f707",
    measurementId: "G-DD8RZY54ZE"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const listsCol = collection(db, "lists");

  // DOM Views
  const authView = document.getElementById("view-auth");
  const dashboardView = document.getElementById("view-dashboard");
  const detailView = document.getElementById("view-list-detail");
  const pinInput = document.getElementById("auth-pin");
  const authError = document.getElementById("auth-error");

  // State
  let activeListId = null;
  let activeListName = "";
  let currentItems = [];
  let unsubscribeLists = null;
  let unsubscribeItems = null;

  // --- PINCODE LOGICA ---
  function checkStoredAuth() {
    const savedPin = localStorage.getItem("boodschappen_auth_pin");
    if (savedPin === APP_PIN) {
      unlockApp();
    } else {
      authView.classList.remove("hidden");
      dashboardView.classList.add("hidden");
      detailView.classList.add("hidden");
    }
  }

  document.getElementById("auth-form").addEventListener("submit", (e) => {
    e.preventDefault();
    if (pinInput.value === APP_PIN) {
      localStorage.setItem("boodschappen_auth_pin", APP_PIN);
      authError.textContent = "";
      pinInput.value = "";
      unlockApp();
    } else {
      authError.textContent = "Onjuiste pincode. Probeer opnieuw.";
      pinInput.value = "";
      pinInput.focus();
    }
  });

  document.getElementById("btn-lock-app").addEventListener("click", () => {
    localStorage.removeItem("boodschappen_auth_pin");
    if (unsubscribeLists) unsubscribeLists();
    if (unsubscribeItems) unsubscribeItems();
    dashboardView.classList.add("hidden");
    detailView.classList.add("hidden");
    authView.classList.remove("hidden");
  });

  function unlockApp() {
    authView.classList.add("hidden");
    dashboardView.classList.remove("hidden");
    startDashboardListener();
  }

  // --- AUTOCOMPLETE PRODUCTEN (products.json) ---
  let commonGroceries = [];
  fetch('products.json?v=' + Date.now())
    .then(res => res.ok ? res.json() : [])
    .then(data => { commonGroceries = data; })
    .catch(() => {
      commonGroceries = ["Banaan", "Bananen", "Brood", "Melk", "Tomaten", "Appels", "Eieren", "Kaas"];
    });

  const inputEl = document.getElementById("item-input");
  const suggestionsEl = document.getElementById("suggestions");

  inputEl.addEventListener("input", () => {
    const val = inputEl.value.toLowerCase().trim();
    suggestionsEl.innerHTML = "";
    if (val.length < 1) {
      suggestionsEl.style.display = "none";
      return;
    }

    const matches = commonGroceries
      .filter(item => typeof item === "string" && item.toLowerCase().includes(val))
      .slice(0, 6);

    if (matches.length === 0) {
      suggestionsEl.style.display = "none";
      return;
    }

    matches.forEach(item => {
      const li = document.createElement("li");
      li.textContent = item;
      li.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        inputEl.value = item;
        suggestionsEl.style.display = "none";
        inputEl.focus();
      });
      suggestionsEl.appendChild(li);
    });

    suggestionsEl.style.display = "block";
  });

  document.addEventListener("pointerdown", (e) => {
    if (!inputEl.contains(e.target) && !suggestionsEl.contains(e.target)) {
      suggestionsEl.style.display = "none";
    }
  });

  // --- DASHBOARD: LIJSTEN BEHEREN ---
  function startDashboardListener() {
    if (unsubscribeLists) return;

    const listsContainer = document.getElementById("lists-container");
    const listsEmpty = document.getElementById("lists-empty");
    const qLists = query(listsCol, orderBy("createdAt", "asc"));

    unsubscribeLists = onSnapshot(qLists, (snapshot) => {
      listsContainer.innerHTML = "";
      if (snapshot.empty) {
        listsEmpty.classList.remove("hidden");
      } else {
        listsEmpty.classList.add("hidden");
      }

      snapshot.forEach(docSnap => {
        const data = docSnap.data();
        const li = document.createElement("li");
        li.className = "list-card";
        li.innerHTML = `
          <div class="card-info">
            <h3>${data.name}</h3>
            <span>Tik om te openen</span>
          </div>
          <button class="btn-delete-card" title="Lijst verwijderen">&times;</button>
        `;

        li.addEventListener("click", () => openList(docSnap.id, data.name));

        li.querySelector(".btn-delete-card").addEventListener("click", (e) => {
          e.stopPropagation();
          openModal(
            `Lijst '${data.name}' verwijderen?`,
            "Weet je het zeker? De hele lijst en alle producten worden gewist.",
            async () => {
              const itemsRef = collection(db, "lists", docSnap.id, "items");
              const itemsSnap = await getDocs(itemsRef);
              const batch = writeBatch(db);
              itemsSnap.forEach(d => batch.delete(d.ref));
              batch.delete(doc(db, "lists", docSnap.id));
              await batch.commit();
            }
          );
        });

        listsContainer.appendChild(li);
      });
    });
  }

  document.getElementById("add-list-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("new-list-name");
    const name = input.value.trim();
    if (!name) return;

    await addDoc(listsCol, {
      name: name,
      createdAt: serverTimestamp()
    });
    input.value = "";
  });

  // --- DETAIL: EEN GEOPENDE LIJST ---
  function openList(listId, listName) {
    activeListId = listId;
    activeListName = listName;
    document.getElementById("active-list-title").textContent = listName;

    dashboardView.classList.add("hidden");
    detailView.classList.remove("hidden");

    listenToItems(listId);
  }

  document.getElementById("btn-back-to-dashboard").addEventListener("click", () => {
    if (unsubscribeItems) unsubscribeItems();
    activeListId = null;
    detailView.classList.add("hidden");
    dashboardView.classList.remove("hidden");
  });

  function listenToItems(listId) {
    if (unsubscribeItems) unsubscribeItems();

    const itemsCol = collection(db, "lists", listId, "items");
    const qItems = query(itemsCol, orderBy("order", "asc"));
    const clearBtn = document.getElementById("btn-open-clear-items");
    const itemsEmpty = document.getElementById("items-empty");

    unsubscribeItems = onSnapshot(qItems, (snapshot) => {
      currentItems = [];
      snapshot.forEach(docSnap => {
        currentItems.push({ id: docSnap.id, ...docSnap.data() });
      });

      clearBtn.disabled = currentItems.length === 0;
      if (currentItems.length === 0) {
        itemsEmpty.classList.remove("hidden");
      } else {
        itemsEmpty.classList.add("hidden");
      }

      renderItems();
    });
  }

  function renderItems() {
    const listEl = document.getElementById("items-list");
    listEl.innerHTML = "";

    currentItems.forEach((item, index) => {
      const li = document.createElement("li");
      li.className = "item-row";

      li.innerHTML = `
        <div class="item-left">
          <input type="checkbox" ${item.completed ? "checked" : ""}>
          <span class="item-name ${item.completed ? "done" : ""}">${item.name}</span>
        </div>
        <div class="item-actions">
          <button class="btn-move btn-up" ${index === 0 ? "disabled" : ""} title="Omhoog">▲</button>
          <button class="btn-move btn-down" ${index === currentItems.length - 1 ? "disabled" : ""} title="Omlaag">▼</button>
          <button class="btn-delete-item" title="Verwijderen">&times;</button>
        </div>
      `;

      li.querySelector(".item-left").addEventListener("click", () => {
        const itemRef = doc(db, "lists", activeListId, "items", item.id);
        updateDoc(itemRef, { completed: !item.completed });
      });

      li.querySelector(".btn-up").addEventListener("click", (e) => {
        e.stopPropagation();
        if (index > 0) swapOrder(index, index - 1);
      });

      li.querySelector(".btn-down").addEventListener("click", (e) => {
        e.stopPropagation();
        if (index < currentItems.length - 1) swapOrder(index, index + 1);
      });

      li.querySelector(".btn-delete-item").addEventListener("click", (e) => {
        e.stopPropagation();
        const itemRef = doc(db, "lists", activeListId, "items", item.id);
        deleteDoc(itemRef);
      });

      listEl.appendChild(li);
    });
  }

  async function swapOrder(idx1, idx2) {
    const item1 = currentItems[idx1];
    const item2 = currentItems[idx2];
    const batch = writeBatch(db);

    const ref1 = doc(db, "lists", activeListId, "items", item1.id);
    const ref2 = doc(db, "lists", activeListId, "items", item2.id);

    batch.update(ref1, { order: item2.order ?? idx2 });
    batch.update(ref2, { order: item1.order ?? idx1 });
    await batch.commit();
  }

  document.getElementById("add-item-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = inputEl.value.trim();
    if (!name || !activeListId) return;

    const nextOrder = currentItems.length > 0 
      ? Math.max(...currentItems.map(i => i.order ?? 0)) + 1 
      : 1;

    const itemsCol = collection(db, "lists", activeListId, "items");
    await addDoc(itemsCol, {
      name: name,
      completed: false,
      order: nextOrder,
      createdAt: serverTimestamp()
    });

    inputEl.value = "";
    suggestionsEl.style.display = "none";
  });

  document.getElementById("btn-open-clear-items").addEventListener("click", () => {
    openModal(
      `Alle producten wissen?`,
      `Weet je zeker dat je alle producten van '${activeListName}' wilt wissen?`,
      async () => {
        if (!activeListId || currentItems.length === 0) return;
        const batch = writeBatch(db);
        currentItems.forEach(item => {
          batch.delete(doc(db, "lists", activeListId, "items", item.id));
        });
        await batch.commit();
      }
    );
  });

  // --- UNIVERSEEL POP-UP MODAAL ---
  const modalEl = document.getElementById("confirm-modal");
  const modalTitle = document.getElementById("modal-title");
  const modalMsg = document.getElementById("modal-message");
  const modalCancel = document.getElementById("btn-modal-cancel");
  const modalConfirm = document.getElementById("btn-modal-confirm");
  let onConfirmCallback = null;

  function openModal(title, message, onConfirm) {
    modalTitle.textContent = title;
    modalMsg.textContent = message;
    onConfirmCallback = onConfirm;
    modalEl.classList.remove("hidden");
  }

  modalCancel.addEventListener("click", () => {
    modalEl.classList.add("hidden");
    onConfirmCallback = null;
  });

  modalConfirm.addEventListener("click", async () => {
    modalEl.classList.add("hidden");
    if (onConfirmCallback) await onConfirmCallback();
    onConfirmCallback = null;
  });

  // Start verificatie bij het laden van de pagina
  checkStoredAuth();
</script>
</body>
</html>
